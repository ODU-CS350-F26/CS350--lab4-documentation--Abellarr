plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.0'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}

application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}

task copyWebPages (type: Copy) {
    from 'src/main/html'
    into 'build/reports'
    dependsOn 'build'
}

task copyDocs (type: Copy) {
    from 'build/docs'
    into 'build/reports'
    dependsOn 'javadoc'
}

task reports (dependsOn: ['copyWebPages', 'copyDocs']) {
    description = 'Copies the web pages and javadocs to the reports directory'
}

build.dependsOn javadoc

/////////// Publication of website to GitHub /////////////
gitPublishCopy.dependsOn reports
gitPublish {
    repoUri = 'git@github.com:ODU-CS350-F26/CS350--lab4-documentation--Abellarr.git'
    branch ='gh-pages'
    contents {
        from 'build/reports'
    }
}

task deployReports (dependsOn: ['reports', 'gitPublishPush']) {
    description = 'Deploys the reports to the gh-pages branch of the repository'
}